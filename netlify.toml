[build]
command = "npm run build"
publish = "dist"
[[redirects]]
from = "/*"
to = "/index.html"
status = 200
[[headers]]
for = "/*"
[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "no-referrer"
# Allow only the exact inline Netlify HUD script reported by the deployed browser.
# If Netlify changes that script, its new contents remain blocked until reviewed.
Content-Security-Policy = "default-src 'self'; connect-src 'self' https: http://localhost:8000; style-src 'self' 'unsafe-inline'; script-src 'self' 'sha256-BkKP2XO6WOEc3kXOiLr2ZoY83hamalKjPY9xBcbXVuw='; img-src 'self' data:; frame-ancestors 'none'"
